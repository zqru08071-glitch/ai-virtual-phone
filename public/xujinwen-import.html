<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>许今闻 → float 导入</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:24px 18px 40px; font:15px/1.7 -apple-system,"PingFang SC",sans-serif; background:#101014; color:#e8e8ee; }
  h1 { font-size:20px; margin:0 0 6px; }
  .sub { color:#8b8b98; font-size:13px; margin-bottom:16px; }
  .card { background:#1a1a22; border:1px solid #2a2a36; border-radius:14px; padding:16px; margin-bottom:14px; }
  .btn { display:inline-block; border:0; border-radius:9px; padding:11px 20px; font-size:14px; font-weight:600; margin:4px 6px 0 0; background:#2f6bff; color:#fff; }
  .btn.gray { background:#33333f; } .btn.green { background:#1f9e5a; }
  .log { margin-top:12px; background:#0c0c10; border-radius:9px; padding:10px 12px; font:12px/1.7 ui-monospace,Menlo,monospace; color:#b7b7c6; max-height:300px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
  .log .ok { color:#5fd38a; } .log .err { color:#ff7a7a; } .log .dim { color:#666672; }
  .stat { font-size:13px; color:#8b8b98; margin-top:6px; }
  .tip { font-size:13px; color:#9aa; line-height:1.8; }
</style>
</head>
<body>
<h1>许今闻 → 小手机（float）</h1>
<div class="sub">SillyTavern 酒馆卡完整转换：人设 + 65 条世界书（含全部IF线/时期线） + 65 个开场白（歌曲线）。写入 float 本机存档（AiPhoneKvDB / ai_phone_characters_v1）。</div>

<div class="card">
  <div class="stat" id="stat">检测中…</div>
  <button class="btn green" id="btnWrite">写入/更新这张卡</button>
  <button class="btn gray" id="btnRemove">从存档移除本卡</button>
  <button class="btn gray" id="btnRestore">还原写入前备份</button>
  <div class="tip" style="margin-top:10px">打开本页会自动写入一次。写完后：<br>1. 切回 float 小手机，回到桌面（或杀掉重开）<br>2. 进「角色」页，即可看到「许今闻」<br>3. 新开对话时，先在输入框问他要第几号开场白（1~65，每号对应一首歌一条线），他会把完整开场白+状态栏发出来</div>
</div>
<div class="log" id="log">就绪。</div>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
function log(msg, cls){ var d=document.createElement('div'); if(cls)d.className=cls; d.textContent=msg; $('log').appendChild(d); $('log').scrollTop=1e9; }
function clearLog(){ $('log').innerHTML=''; }
var CARD = null;
function loadCard(){
  return fetch('/xujinwen-card.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(j){ CARD = j; log('卡 JSON 已加载（'+JSON.stringify(CARD).length+' 字节）','ok'); })
    .catch(function(e){ log('× 卡 JSON 加载失败：'+e.message,'err'); });
}

function idbGetAll(dbName, storeName){
  return new Promise(function(res){
    var rq=indexedDB.open(dbName);
    rq.onsuccess=function(){
      var db=rq.result;
      try{
        var g=db.transaction(storeName,'readonly').objectStore(storeName).getAll();
        g.onsuccess=function(){ res(g.result||[]); };
        g.onerror=function(){ res([]); };
      }catch(e){ res([]); }
      db.close();
    };
    rq.onerror=function(){ res([]); };
  });
}
function idbSet(dbName, storeName, key, val){
  return new Promise(function(res){
    var rq=indexedDB.open(dbName);
    rq.onsuccess=function(){
      var db=rq.result;
      try{
        var p=db.transaction(storeName,'readwrite').objectStore(storeName).put({key:key, value:val});
        p.onsuccess=function(){ res(true); };
        p.onerror=function(){ res(false); };
      }catch(e){ res(false); }
      db.close();
    };
    rq.onerror=function(){ res([]); };
  });
}
function safeParse(s){ try{ return JSON.parse(s); }catch(e){ return null; } }

var CHARKEY = 'ai_phone_characters_v1';
var CARDID = 'char_xujinwen';

function detect(){
  return idbGetAll('AiPhoneKvDB','entries').then(function(all){
    var rec = null;
    for (var i=0;i<all.length;i++){ if(all[i].key===CHARKEY) rec=all[i]; }
    var chars = rec ? (safeParse(rec.value)||[]) : (safeParse(localStorage.getItem(CHARKEY))||[]);
    if(!Array.isArray(chars)) chars=[];
    var hit = chars.some(function(c){ return c && c.id===CARDID; });
    $('stat').textContent = '当前角色表 '+chars.length+' 张 | 本卡'+(hit?'已存在（将覆盖更新）':'未导入');
    return chars;
  });
}
var backup = null;
function doWrite(){
  clearLog();
  if(!CARD){ log('× 卡未加载，稍候重试。','err'); return Promise.resolve(); }
  log('写入「许今闻」…','dim');
  return detect().then(function(chars){
    backup = JSON.stringify(chars);
    var now = new Date().toISOString();
    var c = Object.assign({}, CARD, { id: CARDID, createdAt: now, updatedAt: now });
    var arr = chars.slice(), hit=false;
    for (var i=0;i<arr.length;i++){ if(arr[i].id===CARDID){ arr[i]=c; hit=true; break; } }
    if(!hit) arr.push(c);
    var val = JSON.stringify(arr);
    return Promise.resolve(val);
  }).then(function(val){
    return idbSet('AiPhoneKvDB','entries',CHARKEY,val).then(function(ok){
      if(ok){ log('√ 已写入 IndexedDB（角色表更新）','ok'); }
      else { localStorage.setItem(CHARKEY,val); log('√ IndexedDB 不可写，已写 localStorage','ok'); }
      log('完成！回 float 桌面刷新 → 「角色」页查看。','ok');
      return detect();
    });
  });
}
function doRemove(){
  clearLog();
  return detect().then(function(chars){
    var kept = chars.filter(function(c){ return c && c.id!==CARDID; });
    if(kept.length===chars.length){ log('存档里没有本卡，无需移除。','dim'); return; }
    backup = JSON.stringify(chars);
    var val = JSON.stringify(kept);
    return idbSet('AiPhoneKvDB','entries',CHARKEY,val).then(function(){
      log('√ 已移除本卡（写入前快照已留，可还原）。','ok');
      return detect();
    });
  });
}
function doRestore(){
  if(!backup){ log('× 没有备份（先点一次写入）。','err'); return; }
  return idbSet('AiPhoneKvDB','entries',CHARKEY,backup).then(function(){
    log('√ 已还原写入前角色表。','ok');
    return detect();
  });
}
$('btnWrite').onclick=doWrite;
$('btnRemove').onclick=doRemove;
$('btnRestore').onclick=doRestore;
loadCard().then(detect).then(function(){ setTimeout(doWrite, 600); });
})();
</script>
</body>
</html>
